name: DuckDB runtime candidate

on:
  push:
    branches: [fix/duckdb-1-5-6-proxy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.8.0
          args: --timeout=15m
      - name: Verify embedded version, SQL access and persistent reopen
        run: just test-embedded-version v1.5.6
      - name: Verify appender error contract
        run: just test-appender-contract
      - name: Run unit tests
        run: just test-unit
      - name: Build candidate without publishing a release
        run: |
          just build-release "v0.1.6-layerbase"
          mkdir -p candidate
          cp duckgres candidate/duckgres-linux-${{ matrix.arch }}
          cd candidate
          sha256sum duckgres-linux-${{ matrix.arch }} > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: duckgres-duckdb-1.5.6-linux-${{ matrix.arch }}-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
