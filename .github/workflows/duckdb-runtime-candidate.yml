name: DuckDB runtime candidate

on:
  push:
    branches: [fix/duckdb-2-cloud-sql]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        runtime:
          - duckdb: 1.5.6
            bindings: v0.10506.0
            artifact_version: v0.1.7-layerbase
          - duckdb: 2.0.0
            bindings: v0.20000.0
            artifact_version: v0.2.0-layerbase
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      DUCKGRES_EXPECTED_DUCKDB_VERSION: v${{ matrix.runtime.duckdb }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Select exact stable bindings
        run: |
          go mod edit -require=github.com/duckdb/duckdb-go-bindings@${{ matrix.runtime.bindings }}
          go mod tidy
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.8.0
          args: --timeout=15m
      - name: Verify embedded version, SQL access and persistent reopen
        run: just test-embedded-version v${{ matrix.runtime.duckdb }}
      - name: Verify actual wire COPY rollback, converted types, NULLs and profiling
        run: just test-cloud-sql v${{ matrix.runtime.duckdb }}
      - name: Preserve upstream driver diagnostic result
        shell: bash
        run: |
          set +e
          just test-appender-contract > appender-diagnostic.txt 2>&1
          status=$?
          set -e
          cat appender-diagnostic.txt
          if [ "${{ matrix.runtime.duckdb }}" = "1.5.6" ] && [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "${{ matrix.runtime.duckdb }}" = "2.0.0" ] && [ "$status" -ne 0 ]; then
            test "$status" -eq 1
            python3 scripts/check-appender-diagnostic.py appender-diagnostic.txt
            echo '::warning::Known upstream driver continuation-after-error contract fails on stable 2.0 bindings. Duckgres stops at the first error; wire rollback tests are the release gate. See duckdb/duckdb-go#217.'
          fi
          echo "Diagnostic exit status: $status" >> appender-diagnostic.txt
          {
            echo '### Upstream appender diagnostic (continues after AppendRow errors)'
            echo "DuckDB ${{ matrix.runtime.duckdb }}: exit status $status. Duckgres never continues after an AppendRow error."
            echo 'The exact diagnostic log is retained with the candidate artifact. Actual wire rollback and persisted rows are separately required.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run unit tests
        run: just test-unit
      - name: Build candidate without publishing a release
        run: |
          just build-release "${{ matrix.runtime.artifact_version }}"
          mkdir -p candidate
          cp duckgres candidate/duckgres-linux-${{ matrix.platform.arch }}
          cp appender-diagnostic.txt candidate/
          go list -m all > candidate/dependencies.txt
          cp go.mod go.sum candidate/
          printf '%s\n' '${{ github.sha }}' > candidate/source-commit.txt
          cd candidate
          sha256sum duckgres-linux-${{ matrix.platform.arch }} > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: duckgres-duckdb-${{ matrix.runtime.duckdb }}-linux-${{ matrix.platform.arch }}-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
